<!DOCTYPE html>
<html>
<head>
  <base href="/discussion-1-bms/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bilingual billing management and financial dashboard for small businesses.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="نظام الفوترة">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Billing Management System | Group 16</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (async function loadBmsApp() {
      const isLocal = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
      if (isLocal) {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      }

      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + Date.now();
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
